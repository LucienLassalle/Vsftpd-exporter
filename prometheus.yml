# Prometheus configuration file example

global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

# Alert rule files
rule_files:
  # - "alerts.yml"

# Scrape configuration
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Vsftpd Exporter monitoring
  - job_name: 'vsftp-exporter'
    static_configs:
      - targets: ['vsftp-exporter:9101']
        labels:
          service: 'vsftpd'
          environment: 'production'
    scrape_interval: 30s
    scrape_timeout: 10s
    metrics_path: /metrics

  # If there are multiple FTP servers, you can add more targets
  # - job_name: 'vsftp-exporter-dev'
  #   static_configs:
  #     - targets: ['dev-server:9101']
  #       labels:
  #         service: 'vsftpd'
  #         environment: 'development'
