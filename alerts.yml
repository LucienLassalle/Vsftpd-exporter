groups:
  - name: vsftp_alerts
    interval: 30s
    rules:
      # FTP service unavailable alert
      - alert: VsftpdServiceDown
        expr: vsftp_login_success == 0
        for: 2m
        labels:
          severity: critical
          service: vsftpd
        annotations:
          summary: "Vsftpd service unavailable"
          description: "Vsftpd service on instance {{ $labels.instance }} has been down for more than 2 minutes"

      # High login failure rate alert
      - alert: HighFailedLoginRate
        expr: rate(vsftp_failed_logins_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "FTP login failure rate is too high"
          description: "Login failure rate on instance {{ $labels.instance }} exceeded 10 times/minute in the past 5 minutes"

      # High transfer error rate alert
      - alert: HighTransferErrorRate
        expr: rate(vsftp_transfer_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "FTP transfer error rate is too high"
          description: "Transfer error rate on instance {{ $labels.instance }} exceeded 5 times/minute in the past 5 minutes, error type: {{ $labels.type }}"

      # High connection count alert
      - alert: HighConnectionCount
        expr: vsftp_connections > 100
        for: 5m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "FTP connection count is too high"
          description: "Connection count on instance {{ $labels.instance }} is {{ $value }}, exceeding threshold 100"

      # Too many CLOSE_WAIT connections alert (possible connection leak)
      - alert: HighCloseWaitConnections
        expr: vsftp_close_wait_connections > 20
        for: 10m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "Too many CLOSE_WAIT connections"
          description: "CLOSE_WAIT connection count on instance {{ $labels.instance }} is {{ $value }}, possible connection leak"

      # Frequent connection timeout alert
      - alert: FrequentConnectionTimeouts
        expr: rate(vsftp_connection_timeouts_total[5m]) > 3
        for: 5m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "Frequent connection timeouts"
          description: "Connection timeout rate on instance {{ $labels.instance }} exceeded 3 times/minute in the past 5 minutes"

      # Frequent authentication errors alert
      - alert: FrequentAuthenticationErrors
        expr: rate(vsftp_authentication_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "Frequent authentication errors"
          description: "Authentication error rate on instance {{ $labels.instance }} exceeded 5 times/minute in the past 5 minutes, possible brute force attack"

      # Rapid reconnection anomaly alert
      - alert: RapidReconnections
        expr: rate(vsftp_rapid_reconnections_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "Rapid reconnection anomaly detected"
          description: "Rapid reconnection rate on instance {{ $labels.instance }} exceeded 10 times/minute in the past 5 minutes - possible security threat or misconfigured client"

      # High bandwidth usage alert
      - alert: HighBandwidthUsage
        expr: vsftp_bandwidth_usage_bytes_per_second > 100000000  # 100 MB/s
        for: 5m
        labels:
          severity: info
          service: vsftpd
        annotations:
          summary: "High bandwidth usage"
          description: "Bandwidth usage on instance {{ $labels.instance }} is {{ $value | humanize }}B/s, exceeding 100 MB/s"

      # Low transfer speed alert
      - alert: LowAverageTransferSpeed
        expr: vsftp_average_transfer_speed_bytes_per_second < 1048576 and vsftp_average_transfer_speed_bytes_per_second > 0  # < 1 MB/s
        for: 10m
        labels:
          severity: info
          service: vsftpd
        annotations:
          summary: "Low average transfer speed"
          description: "Average transfer speed on instance {{ $labels.instance }} is {{ $value | humanize }}B/s (< 1 MB/s) for the past 10 minutes - possible network issue"

      # High number of concurrent transfers
      - alert: HighConcurrentTransfers
        expr: vsftp_concurrent_transfers > 50
        for: 5m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "High concurrent transfers"
          description: "Concurrent transfers on instance {{ $labels.instance }} is {{ $value }}, exceeding threshold of 50 - server may be under heavy load"

      # Anomalous client activity
      - alert: UnusualClientActivity
        expr: count(rate(vsftp_client_connections_total[5m]) > 0) > 20
        for: 10m
        labels:
          severity: info
          service: vsftpd
        annotations:
          summary: "Unusual number of active clients"
          description: "Instance {{ $labels.instance }} has more than 20 unique active clients in the past 10 minutes"

      # Max connections limit reached alert
      - alert: MaxConnectionsReached
        expr: rate(vsftp_max_connections_reached_total[5m]) > 0
        for: 2m
        labels:
          severity: warning
          service: vsftpd
        annotations:
          summary: "Max connections limit reached"
          description: "Instance {{ $labels.instance }} reached max connections limit multiple times in the past 5 minutes"

      # Exporter unavailable alert
      - alert: VsftpExporterDown
        expr: up{job="vsftp-exporter"} == 0
        for: 2m
        labels:
          severity: critical
          service: vsftpd-exporter
        annotations:
          summary: "Vsftpd Exporter unavailable"
          description: "Vsftpd Exporter on instance {{ $labels.instance }} has been down for more than 2 minutes"
