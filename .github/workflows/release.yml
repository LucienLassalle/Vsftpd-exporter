name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Build multi-platform binaries
        run: |
          make build-linux
          make build-windows
          make build-darwin

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            vsftp-exporter-linux-amd64
            vsftp-exporter-windows-amd64.exe
            vsftp-exporter-darwin-amd64
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
